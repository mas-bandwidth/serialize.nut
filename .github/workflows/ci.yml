# serialize.nut: CI on the pinned interpreter.
#
# The interpreter pin lives in the Makefile and only there (DESIGN.md (i) THE
# RUNNER): the URL, the sha256 and the sq64/SQUSEDOUBLE build are all spelled
# once, in `make dist-squirrel`. This workflow calls make and never repeats
# either the URL or the sha256; the cache key is derived from the pin itself.
#
# DESIGN.md's pins table makes STANDARD.md, IMPLEMENTING.md, conformance/ and
# conformance-controls/ VERBATIM copies of mas-bandwidth/serialize tag v2.1.0
# (tools/revendor.sh re-vendors them). The corpus job below holds them to that
# release, never to main: an upstream merge mid-day must not change what a
# commit's CI proves. Bump the tag family-wide, deliberately.
#
# The jobs run on this repository's own fleet runners (rowan-tools
# fleet/runners.tsv, set serialize.nut), never GitHub's hosted machines.

name: ci

on:
  push:
    branches: [main, sprint/serialize-squirrel]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # THE FORK GUARD: this repository is PUBLIC and these are its own fleet
    # runners, so a pull request from a fork never reaches them
    # (tools/checkci/check-ci.sh holds every job to it).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    steps:
      - uses: actions/checkout@v4

      - name: The workflow holds the design's pins
        run: make check-ci

      - name: Read the interpreter pin from the Makefile
        id: pin
        run: |
          sha256=$(sed -n 's/^SQUIRREL_SHA256[[:space:]]*:=[[:space:]]*//p' Makefile | head -n 1)
          version=$(sed -n 's/^SQUIRREL_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -n 1)
          test -n "$sha256"
          test -n "$version"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned interpreter build
        uses: actions/cache@v4
        with:
          path: dist
          key: squirrel-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Fetch and build the pinned interpreter
        run: make dist-squirrel

      - name: Test
        run: make test

      - name: Go, only when there is fuzz code
        if: ${{ hashFiles('fuzz/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: fuzz/go.mod
          cache-dependency-path: fuzz/go.sum

      - name: Fuzz, only when there is fuzz code
        if: ${{ hashFiles('fuzz/go.mod') != '' }}
        run: make fuzz

      # the fuzzer's reversed witness: with the Go writer widening each int
      # range by one bit the differential must go red, by a disagreement
      - name: Fuzz negative control, only when there is fuzz code
        if: ${{ hashFiles('fuzz/go.mod') != '' }}
        run: make fuzz-negative-control

  corpus:
    name: STANDARD.md, IMPLEMENTING.md, conformance/ and conformance-controls/ match the pinned release
    # THE FORK GUARD: this repository is PUBLIC and these are its own fleet
    # runners, so a pull request from a fork never reaches them
    # (tools/checkci/check-ci.sh holds every job to it).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, serialize]
    env:
      SERIALIZE_TAG: v2.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Clone the reference at the pinned release
        run: git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git "$RUNNER_TEMP/serialize"

      - name: The vendored standard and corpus are that release's, byte for byte
        run: |
          diff -ru "$RUNNER_TEMP/serialize/conformance" conformance
          diff -ru "$RUNNER_TEMP/serialize/conformance-controls" conformance-controls
          diff -ru "$RUNNER_TEMP/serialize/STANDARD.md" STANDARD.md
          diff -ru "$RUNNER_TEMP/serialize/IMPLEMENTING.md" IMPLEMENTING.md
