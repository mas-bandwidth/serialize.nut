# serialize.nut: the nightly conformance functional test, against the C/C++
# reference's CURRENT corpus.
#
# ci.yml holds the vendored conformance/ and conformance-controls/ to the
# pinned ref (SERIALIZE_REF), deliberately: an upstream merge mid-day must not
# change what a commit's CI proves. That leaves one gap, and this job closes
# it: nothing checked this port against mas-bandwidth/serialize main as it is
# tonight. So every night this job
#
#   1. clones mas-bandwidth/serialize at main HEAD and builds the C/C++
#      reference with its own CMake targets, then runs the reference's
#      conformance tests (the corpus and every negative control) through it.
#      serialize has no corpus generator, by design (conformance.cpp: a suite
#      that regenerates its own expectations proves only that a port agrees
#      with itself), so the corpus is the committed one, proven against the
#      reference here before this port reads a byte of it;
#   2. runs this port's conformance runner (make test T=conformance) with
#      SERIALIZE_CORPUS_DIR pointed at that checkout, not the vendored copy:
#      every encode byte for byte, every decode of the reference's bytes to
#      its values, every control still refusing;
#   3. diffs the vendored copy against that checkout. Drift fails the job: a
#      port behind the standard is what this job exists to catch.
#
# The negative_control input proves the job can go red: it flips one hex digit
# of one vector in a scratch copy of the upstream corpus and points the port
# at the copy. Nothing broken is ever committed.
#
# Scheduled and dispatched only, never on push or pull_request, so the
# one-minute CI rule is untouched. It runs on the org fleet, never GitHub's
# hosted machines; the interpreter pin stays in the Makefile (make
# dist-squirrel), as in ci.yml.

name: nightly-conformance

on:
  schedule:
    - cron: '50 5 * * *'   # every day at 05:50 UTC
  workflow_dispatch:
    inputs:
      negative_control:
        description: 'Flip one byte of one upstream vector; the job must go red'
        type: boolean
        default: false

jobs:
  conformance:
    name: conformance against mas-bandwidth/serialize main
    # THE FORK GUARD, as every job in ci.yml carries it (this job never runs
    # on a pull request, but the guard is the rule for the fleet's runners).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nightly]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Clone mas-bandwidth/serialize at main HEAD
        run: |
          rm -rf "$RUNNER_TEMP/serialize"
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.git "$RUNNER_TEMP/serialize"
          echo "mas-bandwidth/serialize main at $(git -C "$RUNNER_TEMP/serialize" rev-parse HEAD)"

      # the reference's own targets: the conformance corpus and its negative
      # controls, run through the C/C++ reader
      - name: Build the C/C++ reference and run its conformance tests
        working-directory: ${{ runner.temp }}/serialize
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build -R conformance --output-on-failure

      - name: Read the interpreter pin from the Makefile
        id: pin
        run: |
          sha256=$(sed -n 's/^SQUIRREL_SHA256[[:space:]]*:=[[:space:]]*//p' Makefile | head -n 1)
          version=$(sed -n 's/^SQUIRREL_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -n 1)
          test -n "$sha256"
          test -n "$version"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned interpreter build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: dist
          key: squirrel-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Fetch and build the pinned interpreter
        run: make dist-squirrel

      - name: Point the runner at the upstream corpus
        env:
          NEGATIVE_CONTROL: ${{ inputs.negative_control }}
        run: |
          corpus="$RUNNER_TEMP/corpus"
          rm -rf "$corpus" && mkdir -p "$corpus"
          cp -R "$RUNNER_TEMP/serialize/conformance" "$RUNNER_TEMP/serialize/conformance-controls" "$corpus/"
          if [ "$NEGATIVE_CONTROL" = "true" ]; then
            # NEGATIVE CONTROL: one hex digit of the first vector's bytes in
            # int.txt, flipped in the scratch copy only
            before=$(grep -m 1 -E '^bytes [0-9a-fA-F]' "$corpus/conformance/int.txt")
            perl -pi -e 'if (!$done && s/^(bytes )([0-9a-fA-F])/$1.($2 eq "0" ? "1" : "0")/e) { $done = 1 }' "$corpus/conformance/int.txt"
            after=$(grep -m 1 -E '^bytes [0-9a-fA-F]' "$corpus/conformance/int.txt")
            echo "negative control: conformance/int.txt '$before' -> '$after'; this run must go red"
            test "$before" != "$after"
          fi
          echo "SERIALIZE_CORPUS_DIR=$corpus" >> "$GITHUB_ENV"

      - name: Run this port's conformance runner against the upstream corpus
        run: make test T=conformance

      - name: The vendored corpus has not drifted from mas-bandwidth/serialize main
        if: always()
        run: |
          diff -ru "$RUNNER_TEMP/serialize/conformance" conformance
          diff -ru "$RUNNER_TEMP/serialize/conformance-controls" conformance-controls
          echo "conformance/ and conformance-controls/ match mas-bandwidth/serialize main"
